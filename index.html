                    </table>
                    <div style="font-size:12px; border-top:1px solid #CBD5E1; padding-top:10px; margin-bottom:15px; color:#0F172A;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Subtotal:</span><span>${Number(o.subtotal).toFixed(2)}</span></div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>GST:</span><span>${Number(o.gst).toFixed(2)}</span></div>
                        ${o.discount > 0 ? `<div style="display:flex; justify-content:space-between; margin-bottom:4px; color:#DC2626;"><span>Discount:</span><span>-${Number(o.discount).toFixed(2)}</span></div>` : ''}
                        ${o.roundOff ? `<div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Round Off:</span><span>${Number(o.roundOff).toFixed(2)}</span></div>` : ''}
                        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:16px; margin-top:8px; padding-top:8px; border-top:2px dashed #0F172A;"><span>Grand Total:</span><span>${Number(o.total).toFixed(2)}</span></div>
                    </div>
                    <div style="text-align:center; font-size:11px; font-weight:bold; color:#64748B;">Thank you for shopping!</div>
                </div>
            `;

            let newWin = window.open(url, '_blank');
            if (!newWin) {
                showToast("Popup blocked! Please allow popups for this site.", "warning");
            }

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = pdfContent;

            if (typeof html2pdf !== 'undefined') {
                showToast("Generating PDF...", "success");
                const opt = {
                    margin: 0,
                    filename: `Bill_${o.id}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: [4, 6], orientation: 'portrait' }
                };
                html2pdf().set(opt).from(tempDiv).save().then(() => {
                    posShowSuccess(o);
                    showToast("PDF Downloaded! Please attach it in WhatsApp chat.", "success");
                }).catch(err => {
                    console.error("PDF Error:", err);
                    posShowSuccess(o);
                });
            } else {
                showToast("PDF Library missing. Navigating to success screen.", "warning");
                posShowSuccess(o);
            }
        }

        // -- KEYBOARD SHORTCUTS --
        document.addEventListener('keydown', function (e) {
            if (e.key === 'F2') {
                e.preventDefault();
                if (currentView !== 'pos') navigate('pos');
                setTimeout(() => { const elSearch = el('pos-search'); if (elSearch) elSearch.focus(); }, 100);
            }
            if (e.key === 'F4') {
                e.preventDefault();
                if (currentView !== 'pos') navigate('pos');
                setTimeout(() => { const elBarcode = el('pos-barcode'); if (elBarcode) elBarcode.focus(); }, 100);
            }
            if (e.key === 'F8') {
                e.preventDefault();
                if (currentView === 'pos' && posState.cart.length > 0) {
                    posOpenPayModal();
                }
            }
            if (e.key === 'F9') {
                e.preventDefault();
                if (currentView === 'pos') {
                    posState.cart = [];
                    updatePOSCart();
                }
            }
            if (e.key === 'Escape') {
                closeModal();
                closeBarcodeScanner();
            }
            if (e.key === 'Enter') {
                const modal = el('modal-root');
                if (modal && !modal.classList.contains('hidden')) {
                    const btn = el('pos-confirm-btn');
                    if (btn && !btn.disabled && document.activeElement && document.activeElement.id === 'cash-received-input') {
                        e.preventDefault();
                        btn.click();
                    }
                }
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('login-screen').style.display = 'flex';
        });

    </script>
</body>

</html>
